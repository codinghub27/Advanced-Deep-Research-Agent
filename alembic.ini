# Alembic CLI configuration. The application applies migrations itself at startup
# (research_app/db/migrate.py); this file is for running them by hand:
#   alembic upgrade head          alembic downgrade -1          alembic current
# The database comes from DATABASE_URL (research_app/db/database.py), never from this file.
[alembic]
script_location = research_app/db/migrations
