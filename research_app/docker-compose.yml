
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-research
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - research-net

volumes:
  qdrant_storage:
    driver: local

networks:
  research-net:
    driver: bridge
